name: Lua regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check Lua syntax
        run: find . -name '*.lua' -print0 | xargs -0 -n 1 luac5.1 -p
      - name: Run functionality and UX regressions
        run: lua5.1 tests/run.lua
